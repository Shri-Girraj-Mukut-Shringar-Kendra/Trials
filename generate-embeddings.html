<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Embeddings — My Catalogue</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif
    }

    body {
      background: #f5f3ef;
      color: #1c1a17;
      padding: 32px;
      max-width: 720px;
      margin: 0 auto
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px
    }

    p {
      font-size: 14px;
      color: #7a7670;
      margin-bottom: 16px;
      line-height: 1.6
    }

    button {
      background: #c8a96e;
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 16px
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed
    }

    #log {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      padding: 16px;
      font-size: 12px;
      font-family: monospace;
      height: 340px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.8
    }

    .ok {
      color: #2e7d32
    }

    .err {
      color: #c62828
    }

    .info {
      color: #1565c0
    }

    #bar-wrap {
      background: #fff;
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08)
    }

    #bar {
      height: 100%;
      background: #c8a96e;
      width: 0%;
      transition: width 0.2s
    }
  </style>
</head>

<body>
  <h1>🧠 Generate Image Embeddings</h1>
  <p>
    This builds <code>embeddings.json</code> for "Search by Photo".<br />
    Click <b>Start</b> — the AI model will load, then process all your product images.<br />
    When done, click <b>Download</b> and upload <code>embeddings.json</code> to your <b>my-catalogue</b> GitHub repo.
  </p>
  <button id="startBtn">▶ Start</button>
  <button id="dlBtn" style="display:none;background:#2e7d32">⬇ Download embeddings.json</button>
  <div id="bar-wrap">
    <div id="bar"></div>
  </div>
  <div id="log">Waiting to start…</div>

  <script>
    const logEl = document.getElementById('log');
    const bar = document.getElementById('bar');
    const startBtn = document.getElementById('startBtn');
    const dlBtn = document.getElementById('dlBtn');
    let resultJSON = null;

    function log(msg, cls) {
      const d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function loadScript(src) {
      return new Promise((res, rej) => {
        if (document.querySelector(`script[src="${src}"]`)) return res();
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed: ' + src));
        document.head.appendChild(s);
      });
    }

    // Load image via canvas using a CORS proxy
    function loadImageViaProxy(url) {
      return new Promise((resolve, reject) => {
        // Try multiple proxy approaches
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(url)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        ];

        let tried = 0;
        function tryNext() {
          if (tried >= proxies.length) {
            reject(new Error('All proxies failed'));
            return;
          }
          const img = new Image();
          img.crossOrigin = 'anonymous';
          const proxyUrl = proxies[tried++];
          img.onload = () => resolve(img);
          img.onerror = () => tryNext();
          img.src = proxyUrl;
        }
        tryNext();
      });
    }

    // Alternative: draw image to canvas via fetch+blob
    async function loadImageViaFetch(url) {
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(url)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      ];

      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (!res.ok) continue;
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const img = await new Promise((resolve, reject) => {
            const i = new Image();
            i.onload = () => { URL.revokeObjectURL(blobUrl); resolve(i); };
            i.onerror = reject;
            i.src = blobUrl;
          });
          return img;
        } catch (e) { continue; }
      }
      throw new Error('Image load failed via all proxies');
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      logEl.innerHTML = '';
      bar.style.width = '0%';

      try {
        log('Loading TensorFlow.js…', 'info');
        await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
        log('✓ TensorFlow.js ready', 'ok');

        log('Loading MobileNet…', 'info');
        await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
        log('✓ MobileNet script loaded', 'ok');

        log('Initializing model weights (30–60s first time)…', 'info');
        const model = await mobilenet.load({ version: 2, alpha: 1.0 });
        log('✓ Model ready!', 'ok');

        log('Fetching images.json…', 'info');
        const r = await fetch('https://shri-girraj-mukut-shringar-kendra.github.io/my-catalogue/images.json?t=' + Date.now());
        if (!r.ok) throw new Error('Cannot fetch images.json — ' + r.status);
        const data = await r.json();

        const allImages = [];
        data.forEach(cat => (cat.images || []).forEach(img => allImages.push(img)));
        log(`Found ${allImages.length} images in ${data.length} categories`, 'ok');
        log('Processing images via proxy (this takes a few minutes)…', 'info');

        const embeddings = [];
        let done = 0, skipped = 0;

        for (const item of allImages) {
          try {
            const img = await loadImageViaFetch(item.url);
            const embedding = tf.tidy(() => {
              const tensor = tf.browser.fromPixels(img)
                .resizeBilinear([224, 224])
                .toFloat()
                .div(255.0)
                .expandDims(0);
              return model.infer(tensor, true);
            });
            const vec = Array.from(await embedding.data());
            embedding.dispose();
            embeddings.push({ id: item.id, name: item.name, embedding: vec });
            log(`✓ ${item.name}`, 'ok');
          } catch (e) {
            log(`✗ Skipped "${item.name}" — ${e.message}`, 'err');
            skipped++;
          }
          done++;
          bar.style.width = Math.round((done / allImages.length) * 100) + '%';
          await new Promise(r => setTimeout(r, 30));
        }

        resultJSON = JSON.stringify(embeddings);
        log(`\n✅ Done! ${embeddings.length} processed, ${skipped} skipped.`, 'ok');
        log('Click Download and upload embeddings.json to your my-catalogue GitHub repo!', 'ok');
        dlBtn.style.display = 'inline-block';

      } catch (err) {
        log('ERROR: ' + err.message, 'err');
        startBtn.disabled = false;
      }
    };

    dlBtn.onclick = () => {
      const blob = new Blob([resultJSON], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'embeddings.json';
      a.click();
    };
  </script>
</body>

</html>
